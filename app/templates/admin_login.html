<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>.centered{max-width:400px;margin:3em auto;padding:2em;border:1px solid #ccc;border-radius:8px;}</style>
</head>
<body>
    <div class="centered">
        <h2>Admin Login</h2>
        {% if error %}
            <div style="color:red;margin-bottom:1em;">{{ error }}</div>
        {% endif %}
        <form method="post" action="/transactions/admin-login">
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>
            <button type="submit">Login</button>
        </form>
        <div style="margin-top:1em;"><a href="/transactions">Back to Transactions</a></div>
    </div>
</body>
</html>
